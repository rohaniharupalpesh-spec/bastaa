<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    .product { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .stock-in { color: #12805c; } .stock-low { color: #b54708; } .stock-out { color: #d92d20; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Demo Shop</h1>
  <p>Open this page next to the Stock Manager dashboard and change a quantity — it updates here instantly.</p>

  <div class="product">
    <div><b>Coffee Mug</b><br><small data-stock-sku="MUG"></small></div>
    <button data-stock-sku="MUG" data-stock-disable-when-out>Add to cart</button>
  </div>
  <div class="product">
    <div><b>T-shirt</b><br><small data-stock-sku="TEE"></small></div>
    <button data-stock-sku="TEE" data-stock-disable-when-out>Add to cart</button>
  </div>

  <!-- Replace the src host and data-key with your own (create a READ key under "Website sync"). -->
  <script src="http://localhost:3000/embed.js" data-key="pk_YOUR_READ_KEY" defer></script>
</body>
</html>
